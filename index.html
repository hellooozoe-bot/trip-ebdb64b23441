        <style>
            :root{--ink:#4b3a78;--cobalt:#7558bf;--paper:#fff7f0;--card:#fff;--line:#eadff7;--seal:#c44569;--muted:#766b7e;--round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Yuanti SC","Arial Rounded MT Bold","Varela Round",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
            .staticrypt-html{height:100%}
            .staticrypt-body{min-height:100%;margin:0;background:var(--paper);font-family:var(--round);color:#3d3550;-webkit-font-smoothing:antialiased}
            .staticrypt-content{min-height:100vh;display:flex;flex-direction:column}
            .sc-hero{position:relative;background:linear-gradient(180deg,#ffe1e8 0%,#f3e9ff 60%,#ece4ff 100%);color:var(--ink);padding:30px 24px 0;text-align:center;overflow:hidden;border-radius:0 0 30px 30px}
            .sc-hero:after{display:none}
            .sc-hero svg.lockart{display:block;width:calc(100% + 48px);height:auto;margin:6px -24px 0}
            .sc-kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#a0527a;font-weight:700;margin-top:8px}
            .staticrypt-title{font-family:var(--round);color:var(--ink);font-size:27px;font-weight:700;margin:6px 0 0;letter-spacing:.02em}
            .staticrypt-page{width:100%;max-width:400px;margin:0 auto;padding:22px 18px 40px;box-sizing:border-box}
            .staticrypt-form{background:var(--card);border:0;border-radius:28px;padding:24px 18px;box-shadow:0 10px 24px -16px rgba(75,58,120,.5);border:2px solid var(--line)}
            .staticrypt-instructions p{margin:0 0 14px;line-height:1.4;font-size:14px;color:var(--muted);text-align:center}
            .staticrypt-password-container{position:relative;margin:0 0 14px}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{width:100%;box-sizing:border-box;font-size:17px;padding:15px 48px 15px 16px;border:2px solid var(--line);border-radius:999px;background:#fff;outline:0;color:var(--ink);font-family:var(--round)}
            .staticrypt-form input[type="password"]:focus,.staticrypt-form input[type="text"]:focus{border-color:var(--cobalt)}
            .staticrypt-toggle-password-visibility{cursor:pointer;height:20px;width:20px;opacity:.5;padding:14px;position:absolute;right:0;top:50%;transform:translateY(-50%)}
            label.staticrypt-remember{display:flex;align-items:center;gap:10px;margin:2px 2px 16px;font-size:14px;color:#2a2a33;min-height:32px}
            .staticrypt-remember input[type="checkbox"]{width:20px;height:20px;accent-color:var(--cobalt);margin:0}
            .staticrypt-form .staticrypt-decrypt-button{width:100%;border:0;border-radius:999px;font-family:var(--round);box-shadow:0 4px 0 #5a43a0;padding:16px;background:#7558bf;color:#fff;font-size:16px;font-weight:600;letter-spacing:.04em;cursor:pointer;min-height:52px}
            .staticrypt-form .staticrypt-decrypt-button:active{filter:brightness(1.15)}
            .sc-error{color:var(--seal);font-size:13.5px;text-align:center;margin:12px 0 0;min-height:1em}
            .sc-foot{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
            .hidden{display:none !important}
            .staticrypt-spinner-container{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper)}
            .staticrypt-spinner{width:2rem;height:2rem;border:.25em solid var(--ink);border-right-color:transparent;border-radius:50%;animation:spinner-border .75s linear infinite}
            @keyframes spinner-border{100%{transform:rotate(360deg)}}
        </style>
    </head>
